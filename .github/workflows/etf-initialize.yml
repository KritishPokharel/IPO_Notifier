name: ETF dashboard - initialize verified history

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etf-update
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: etf-dashboard
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      SECONDARY_CLOSE_PROVIDER: twelvedata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: etf-dashboard/package-lock.json
      - run: npm ci
      - name: Load daily ETF history
        run: npm run job:backfill
      - name: Cross-check the latest completed session
        run: npm run job:verified
