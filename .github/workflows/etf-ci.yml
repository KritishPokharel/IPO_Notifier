name: ETF dashboard - CI

on:
  pull_request:
    paths: ["etf-dashboard/**", ".github/workflows/etf-*.yml"]
  push:
    branches: [master, main]
    paths: ["etf-dashboard/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etf-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: etf-dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
